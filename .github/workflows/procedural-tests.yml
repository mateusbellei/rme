name: Procedural masks

on:
  pull_request:
    paths:
      - 'source/**'
      - 'tests/**'
      - 'data/procedural/**'
      - '.github/workflows/procedural-tests.yml'
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'tests/**'
      - 'data/procedural/**'
      - '.github/workflows/procedural-tests.yml'
  workflow_dispatch:

jobs:
  masks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libwxgtk3.2-dev libwxgtk-gl3.2-dev libboost-thread-dev freeglut3-dev libarchive-dev
      - name: Configure
        run: cmake -S tests -B build/procedural-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build tests and editor integration
        run: cmake --build build/procedural-tests --parallel 2
      - name: Test
        run: ctest --test-dir build/procedural-tests --output-on-failure
